repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458  # pragma: allowlist secret -- public v1.5.0 commit
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - .secrets.baseline
        exclude: package\.lock\.json|\.ipynb$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # pragma: allowlist secret -- public v5.0.0 commit
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-yaml
        exclude: ^blueprints/
      - id: check-json
      - id: end-of-file-fixer
        exclude: \.svg$
      - id: trailing-whitespace
        exclude: \.svg$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: d1b833175a5d08a925900115526febd8fe71c98e  # pragma: allowlist secret -- public v0.15.11 commit
    hooks:
      - id: ruff
        args: [--fix]
        files: ^custom_components/
