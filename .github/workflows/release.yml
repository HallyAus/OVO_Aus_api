name: Release

permissions: {}

on:
  push:
    tags:
      - 'v*'
  # One explicitly authorised release request. Creating this exact branch at
  # the tested main SHA runs the normal release gate; other creates do not.
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v4.12.0); created at the run's commit if it does not exist"
        required: true

concurrency:
  group: release-${{ github.event_name == 'create' && 'v4.12.0' || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      ${{ github.repository == 'HallyAus/OVO_Aus_api' &&
          (github.event_name != 'create' ||
           (github.event.ref_type == 'branch' && github.event.ref == 'release/v4.12.0')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'create' && 'v4.12.0' || inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release version and successful CI for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/verify_github_release.py

      - name: Create release zip
        run: python scripts/package_github_release.py

      - name: Build release notes with the maintainer referral
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "docs/releases/${RELEASE_TAG}.md" ]; then
            cp "docs/releases/${RELEASE_TAG}.md" release-notes.md
          else
            prev="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || echo '')"
            if [ -n "$prev" ] && [ "$prev" != "$RELEASE_TAG" ]; then
              auto=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" -f previous_tag_name="$prev" --jq .body)
            else
              auto=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" --jq .body)
            fi
            {
              echo '## Support this project with an OVO referral'
              echo ''
              echo '**Referral code:** `daniel16485`'
              echo '**Direct OVO signup:** https://www.ovoenergy.com.au/refer/daniel16485'
              echo '**Friendly link:** https://ovoreferralcode.com/'
              echo ''
              echo 'Eligible referrals support this integration. Credit depends on the plan and current OVO terms: https://www.ovoenergy.com.au/terms/refer-a-friend/'
              echo ''
              echo '---'
              echo ''
              printf '%s\n' "$auto"
            } > release-notes.md
          fi
          grep -Fq 'daniel16485' release-notes.md
          grep -Fq 'https://www.ovoenergy.com.au/refer/daniel16485' release-notes.md
          grep -Fq 'https://ovoreferralcode.com/' release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: OVO Energy Australia ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: ovo_energy_au.zip
          body_path: release-notes.md

      - name: Verify the published tag, referral and downloaded release ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$RUNNER_TEMP/ovo-release.json"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > "$RUNNER_TEMP/ovo-tag.json"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern ovo_energy_au.zip --dir "$RUNNER_TEMP/ovo-published"
          python - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          release = json.loads((root / 'ovo-release.json').read_text())
          tag = json.loads((root / 'ovo-tag.json').read_text())
          expected_tag = os.environ['RELEASE_TAG']
          if release['tag_name'] != expected_tag or release['draft'] or release['prerelease']:
              raise SystemExit('Unexpected published release state')
          if tag['object']['type'] != 'commit' or tag['object']['sha'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Published tag does not point to the validated source')
          if release['body'].replace('\r\n', '\n').strip() != Path('release-notes.md').read_text().strip():
              raise SystemExit('Published release notes differ from the approved referral notes')
          downloaded = root / 'ovo-published/ovo_energy_au.zip'
          digest = hashlib.sha256(downloaded.read_bytes()).hexdigest()
          if digest != hashlib.sha256(Path('ovo_energy_au.zip').read_bytes()).hexdigest():
              raise SystemExit('Downloaded release ZIP differs from the validated artifact')
          with zipfile.ZipFile(downloaded) as archive:
              if archive.testzip() is not None:
                  raise SystemExit('Published release ZIP failed its integrity check')
              if json.loads(archive.read('ovo_energy_au/manifest.json'))['version'] != expected_tag[1:]:
                  raise SystemExit('Published integration version does not match its tag')
              if any(not name.startswith('ovo_energy_au/') or '\\' in name or '..' in name.split('/') for name in archive.namelist()):
                  raise SystemExit('Published archive contains an unexpected path')
              count = len(archive.namelist())
          print(f'Published {expected_tag}: tag matches source, referral notes verified, {count} ZIP members, SHA-256 {digest}')
          PY
