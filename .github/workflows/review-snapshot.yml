name: Review source snapshot
on:
  push:
    branches: [fix/reliability-review-20260905]
    paths: [.github/workflows/review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar HEAD -o /tmp/ovo-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: ovo-review-source
          path: /tmp/ovo-source.tar
          retention-days: 1
