name: Validate OVO reliability candidate
on:
  push:
    branches: [fix/reliability-review-20260905]
    paths:
      - .github/workflows/apply-review.yml
      - .review/**
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'HallyAus/OVO_Aus_api'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify and apply the reviewed patch
        run: |
          cat .review/0*.bin > /tmp/ovo-review.patch.gz
          echo '38471c62fd6910fde1fa16a22ba72c05b7cb25146dda8e26f1f44a8bbe9d613f  /tmp/ovo-review.patch.gz' | sha256sum --check
          gzip -dc /tmp/ovo-review.patch.gz > /tmp/ovo-review.patch
          git apply --check /tmp/ovo-review.patch
          git apply /tmp/ovo-review.patch
          git rm -- .review/00.bin .review/01.bin .review/02.bin .review/03.bin .github/workflows/apply-review.yml .github/workflows/review-snapshot.yml
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install unit test and static-check dependencies
        run: python -m pip install -e '.[dev]'
      - name: Static checks and unit regressions
        run: |
          ruff check --fix custom_components/ovo_energy_au/
          python -m pytest tests/ -q
          python -m compileall -q custom_components tests tests_ha
          git diff --check
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install actual Home Assistant test environment
        run: python -m pip install -r requirements-test-ha.txt
      - name: Actual Home Assistant lifecycle and entity regressions
        run: python -m pytest tests_ha/ -q --asyncio-mode=auto
      - name: Commit tested fixes to review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add custom_components/ovo_energy_au/time_utils.py requirements-test-ha.txt tests/test_review_regressions.py tests_ha/*.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: harden OVO energy periods, tariffs and authentication (v4.9.3)'
          git push origin HEAD:refs/heads/fix/reliability-review-20260905
