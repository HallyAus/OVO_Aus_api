name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check custom_components/ovo_energy_au/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/hassfest

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/hacs
        with:
          category: integration
          comment: "false"

  runtime:
    name: Home Assistant runtime regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Build the verified stable Home Assistant security backport
        run: |
          python -m venv "$RUNNER_TEMP/ovo-ha-build"
          "$RUNNER_TEMP/ovo-ha-build/bin/python" -m pip install build==1.6.1
          "$RUNNER_TEMP/ovo-ha-build/bin/python" scripts/build_ha_security_runtime.py --output-dir "$RUNNER_TEMP/ovo-ha-security"
      - run: pip install --find-links "$RUNNER_TEMP/ovo-ha-security" -r requirements-test-ha.txt
      - run: python -m pip check
      - run: python -m pytest tests_ha/ -q --asyncio-mode=auto

  security:
    name: Secrets, source security and package dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" -r requirements-security.txt
      - run: pre-commit run detect-secrets --all-files
      - run: bandit -r custom_components/ovo_energy_au/ -q
      - run: python -m pytest .gitea/scripts/ -q
      # The unpublished editable integration is checked as source above.
      # Audit every installed external distribution, including scanner tools.
      - run: |
          python -m pip list --format=freeze --exclude-editable > "$RUNNER_TEMP/ovo-dependency-audit.txt"
          python -m pip_audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/ovo-dependency-audit.txt"

  runtime-security:
    name: Home Assistant dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Build the verified stable Home Assistant security backport
        run: |
          python -m venv "$RUNNER_TEMP/ovo-ha-build"
          "$RUNNER_TEMP/ovo-ha-build/bin/python" -m pip install build==1.6.1
          "$RUNNER_TEMP/ovo-ha-build/bin/python" scripts/build_ha_security_runtime.py --output-dir "$RUNNER_TEMP/ovo-ha-security"
      - run: pip install --find-links "$RUNNER_TEMP/ovo-ha-security" -r requirements-test-ha.txt
      - run: python -m pip check
      # Test the exact resolved environment that is audited in this job too.
      - run: python -m pytest tests_ha/ -q --asyncio-mode=auto
      # Keep the scanner isolated from HA's dependency pins. Audit every actual
      # package with OSV and additionally the verified upstream HA base with
      # PyPI, so the local version label cannot hide an upstream advisory.
      - name: Audit actual dependencies and the upstream base without exclusions
        run: |
          python -m venv "$RUNNER_TEMP/ovo-ha-auditor"
          "$RUNNER_TEMP/ovo-ha-auditor/bin/python" -m pip install pip-audit==2.10.1
          "$RUNNER_TEMP/ovo-ha-auditor/bin/python" scripts/audit_ha_security_runtime.py \
            --runtime-python "$(command -v python)" \
            --provenance "$RUNNER_TEMP/ovo-ha-security/provenance.json" \
            --output-dir "$RUNNER_TEMP/ovo-ha-audit"
      - name: Audit the isolated build and scanner dependencies
        run: |
          OVO_BUILD_SITE_PACKAGES=$("$RUNNER_TEMP/ovo-ha-build/bin/python" -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
          OVO_AUDITOR_SITE_PACKAGES=$("$RUNNER_TEMP/ovo-ha-auditor/bin/python" -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
          "$RUNNER_TEMP/ovo-ha-auditor/bin/python" -m pip_audit --strict --path "$OVO_BUILD_SITE_PACKAGES"
          "$RUNNER_TEMP/ovo-ha-auditor/bin/python" -m pip_audit --strict --path "$OVO_AUDITOR_SITE_PACKAGES"
          python -c 'from scripts.build_ha_security_runtime import BUILD_BACKEND; print(BUILD_BACKEND)' > "$RUNNER_TEMP/ovo-ha-backend-audit.txt"
          "$RUNNER_TEMP/ovo-ha-auditor/bin/python" -m pip_audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/ovo-ha-backend-audit.txt"
